<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICT and Innovation Club | Contact Us</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-wrap">
        <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true"><img src="assets/logos/ict.png" alt="" /></span><span class="logo-text"><strong>ICT and Innovation Club</strong><em>Solution to Evolution</em></span></a>
        <button class="menu-btn" data-menu-btn aria-expanded="false" aria-label="Toggle menu">Menu</button>
        <nav class="nav-links" data-nav-links>
          <a href="index.html">Home</a><a href="about.html">About</a><a href="resources.html">Resources</a><a href="contact.html" class="active">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1 class="section-title reveal">Contact Us</h1>
        <p class="section-text reveal">Send us a message and we will get back to you soon.</p>

        <form class="form reveal" action="https://formspree.io/f/your-form-id" method="POST">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
      </div>
    </main>

    <footer class="footer"><div class="container">© 2026 ICT and Innovation Club — Solution to Evolution</div></footer>
    <script src="js/script.js"></script>
  </body>
</html>
